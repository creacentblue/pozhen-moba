<style>

<script>
'use strict';
window.__err=[];
window.addEventListener('error',e=>{window.__err.push(String(e.message)+' @'+e.lineno)});
const TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const FONT='"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif';
const SERIF='"Noto Serif CJK SC","Songti SC","STKaiti","KaiTi",serif';
function fmtT(t){t=Math.max(0,t|0);return String((t/60)|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}

/* ---------- 音频（全部合成） ---------- */
const AU={ctx:null,master:null,mute:false,camX:0,camY:0,lastPlay:{},musicT:0};
function auInit(){
  if(AU.ctx)return;
  try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)();AU.master=AU.ctx.createGain();AU.master.gain.value=.55;
  const comp=AU.ctx.createDynamicsCompressor();AU.master.connect(comp);comp.connect(AU.ctx.destination);
  const len=AU.ctx.sampleRate*1;AU.nbuf=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate);const d=AU.nbuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}catch(e){AU.ctx=null}
}
function tone(f,dur,type,vol,slide,delay){
  if(!AU.ctx||AU.mute)return;const c=AU.ctx,t=c.currentTime+(delay||0);
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol,fq,q,type,delay,slide){
  if(!AU.ctx||AU.mute)return;const c=AU.ctx,t=c.currentTime+(delay||0);
  const s=c.createBufferSource();s.buffer=AU.nbuf;const f=c.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(fq,t);
  if(slide)f.frequency.exponentialRampToValueAtTime(Math.max(40,fq*slide),t+dur);f.Q.value=q||1;
  const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
}
const SFX={
  hit:v=>{noise(.09,.28*v,1400,1.2);tone(180,.08,'triangle',.18*v,.5)},
  slash:v=>{noise(.14,.22*v,2600,.8,'bandpass',0,.3);tone(300,.1,'triangle',.08*v,.5)},
  shoot:v=>{tone(900,.1,'triangle',.12*v,.4);noise(.07,.1*v,3500,1)},
  bolt:v=>{tone(520,.16,'sawtooth',.12*v,.35);noise(.1,.1*v,1800,2)},
  tower:v=>{tone(220,.22,'square',.14*v,.4);tone(660,.1,'sine',.1*v,.5);noise(.15,.12*v,900,1)},
  coin:v=>{tone(1320,.09,'square',.1*v);tone(1760,.2,'square',.1*v,1,.07)},
  levelup:v=>{[523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.18,1,i*.08))},
  castQ:v=>{tone(420,.2,'sawtooth',.14*v,2.2);noise(.15,.12*v,1500,1.5,'bandpass',0,2)},
  castW:v=>{tone(300,.35,'sine',.2*v,2.5);tone(450,.35,'sine',.12*v,2.5)},
  castE:v=>{noise(.3,.2*v,700,1.5,'bandpass',0,3);tone(200,.3,'triangle',.15*v,1.8)},
  castR:v=>{tone(110,.7,'sawtooth',.2*v,3);noise(.5,.2*v,500,1,'bandpass',0,4);tone(880,.5,'sine',.1*v,.5,.1)},
  boom:v=>{noise(.5,.5*v,260,.6,'lowpass',0,.3);tone(70,.45,'sine',.4*v,.4)},
  kill:v=>{tone(392,.15,'square',.12);tone(523,.15,'square',.12,1,.09);tone(784,.3,'square',.13,1,.18)},
  death:v=>{tone(300,.5,'sawtooth',.18,.35);tone(150,.6,'sine',.2,.4)},
  buy:v=>{tone(880,.08,'square',.1);tone(1175,.12,'square',.1,1,.06)},
  click:v=>{tone(700,.05,'square',.07)},
  recall:v=>{tone(500,.8,'sine',.1,2);tone(750,.8,'sine',.07,2)},
  tpend:v=>{tone(1200,.3,'sine',.15,.4);noise(.3,.15,3000,1)},
  nexus:v=>{noise(1.4,.7,300,.5,'lowpass',0,.15);tone(60,1.2,'sine',.5,.3)},
  victory:v=>{[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.6,'triangle',.2,1,i*.14))},
  defeat:v=>{[392,349,311,262].forEach((f,i)=>tone(f,.8,'triangle',.2,.97,i*.3))},
  warn:v=>{tone(260,.2,'square',.1);tone(200,.25,'square',.1,1,.15)},
  stun:v=>{tone(1400,.12,'square',.08*v,.6)},
};
function sfx(n,x,y){
  if(!AU.ctx||AU.mute)return;let v=1;
  if(x!==undefined){const d=Math.hypot(x-AU.camX,y-AU.camY);v=clamp(1.15-d/1500,0,1);if(v<.06)return}
  const now=AU.ctx.currentTime;if(AU.lastPlay[n]&&now-AU.lastPlay[n]<.035)return;AU.lastPlay[n]=now;
  SFX[n]&&SFX[n](v);
}
const PENTA=[0,2,4,7,9,12,14,16];
function musicTick(dt){ // 极轻的五声音阶古筝音色
  if(!AU.ctx||AU.mute)return;AU.musicT-=dt;if(AU.musicT>0)return;AU.musicT=rnd(.45,1.1);
  if(Math.random()<.25)return;const f=220*Math.pow(2,PENTA[rint(0,7)]/12);
  tone(f,1.6,'triangle',.035,.995);tone(f*2,.8,'sine',.012);
}

/* ---------- 地图 ---------- */
const W=6400,H=2800,WALK=370,ROAD=135,BASE_R=540;
const PATH=[[620,2200],[1500,2200],[2350,1850],[3200,1400],[4050,950],[4900,600],[5780,600]];
const SEGL=[],CUM=[0];let PL=0;
for(let i=0;i<PATH.length-1;i++){const l=Math.hypot(PATH[i+1][0]-PATH[i][0],PATH[i+1][1]-PATH[i][1]);SEGL.push(l);PL+=l;CUM.push(PL)}
function posAt(s){
  s=clamp(s,0,PL);let i=0;while(i<SEGL.length-1&&s>CUM[i+1])i++;
  const t=(s-CUM[i])/SEGL[i];return [lerp(PATH[i][0],PATH[i+1][0],t),lerp(PATH[i][1],PATH[i+1][1],t)];
}
function nearPath(x,y){
  let bd=1e9,bs=0,bx=0,by=0;
  for(let i=0;i<SEGL.length;i++){
    const ax=PATH[i][0],ay=PATH[i][1],dx=PATH[i+1][0]-ax,dy=PATH[i+1][1]-ay;
    const t=clamp(((x-ax)*dx+(y-ay)*dy)/(SEGL[i]*SEGL[i]),0,1);const px=ax+dx*t,py=ay+dy*t;
    const d=Math.hypot(x-px,y-py);if(d<bd){bd=d;bs=CUM[i]+t*SEGL[i];bx=px;by=py}
  }
  return {s:bs,d:bd,x:bx,y:by};
}
const NEXUS_POS=[{x:PATH[0][0],y:PATH[0][1]},{x:PATH[PATH.length-1][0],y:PATH[PATH.length-1][1]}];
function clampWalk(u){
  const n0=NEXUS_POS[0],n1=NEXUS_POS[1];
  if(Math.hypot(u.x-n0.x,u.y-n0.y)<BASE_R-10||Math.hypot(u.x-n1.x,u.y-n1.y)<BASE_R-10)return;
  const p=nearPath(u.x,u.y);
  if(p.d>WALK){const k=WALK/p.d;u.x=p.x+(u.x-p.x)*k;u.y=p.y+(u.y-p.y)*k}
}
function walkPoint(x,y){const u={x,y};clampWalk(u);return u}
const fwd=t=>t===0?1:-1;
/* 地形预渲染 */
let BG=null;const BGS=.55;
function srng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return s/2147483647}}
function buildBG(){
  const cv=document.createElement('canvas');cv.width=W*BGS;cv.height=H*BGS;const g=cv.getContext('2d');g.scale(BGS,BGS);
  const R=srng(7);
  g.fillStyle='#0b1514';g.fillRect(0,0,W,H);
  // 远处雾状色块
  for(let i=0;i<60;i++){const x=R()*W,y=R()*H,r=200+R()*400;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(30,60,56,.28)');gr.addColorStop(1,'rgba(30,60,56,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
  // 外围树林
  for(let i=0;i<5200;i++){
    const x=R()*W,y=R()*H;const p=nearPath(x,y);
    if(p.d<WALK+30||Math.hypot(x-NEXUS_POS[0].x,y-NEXUS_POS[0].y)<BASE_R+30||Math.hypot(x-NEXUS_POS[1].x,y-NEXUS_POS[1].y)<BASE_R+30)continue;
    const r=18+R()*34;const c=R();
    g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(x+6,y+8,r,0,TAU);g.fill();
    g.fillStyle=c<.5?'#12261d':c<.8?'#17301f':'#1d3a26';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
    g.fillStyle='rgba(120,190,120,.10)';g.beginPath();g.arc(x-r*.25,y-r*.3,r*.55,0,TAU);g.fill();
  }
  // 可走区域：草地渐变边缘
  g.lineCap='round';g.lineJoin='round';
  function strokePath(w,col){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(PATH[0][0],PATH[0][1]);for(let i=1;i<PATH.length;i++)g.lineTo(PATH[i][0],PATH[i][1]);g.stroke()}
  strokePath(WALK*2+50,'rgba(20,44,32,.55)');strokePath(WALK*2+20,'rgba(30,58,40,.8)');strokePath(WALK*2-6,'#28463a');
  strokePath(WALK*1.5,'#2d4d3c');strokePath(WALK*1.0,'#33563f');
  // 草丛纹理
  for(let i=0;i<9000;i++){
    const x=R()*W,y=R()*H;const p=nearPath(x,y);if(p.d>WALK-8)continue;
    g.strokeStyle=R()<.5?'rgba(120,180,110,.20)':'rgba(10,30,20,.25)';g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x+rnd2(R,-5,5),y-5-R()*9);g.stroke();
  }
  // 野花
  for(let i=0;i<500;i++){const x=R()*W,y=R()*H;const p=nearPath(x,y);if(p.d>WALK-20||p.d<ROAD+30)continue;g.fillStyle=['#e7c8d6','#f1e3a0','#c9d9f2'][(R()*3)|0];g.globalAlpha=.7;g.beginPath();g.arc(x,y,3,0,TAU);g.fill();g.globalAlpha=1}
  // 基地庭院
  for(const [k,n] of NEXUS_POS.entries()){
    const tint=k===0?'60,150,170':'180,80,60';
    let gr=g.createRadialGradient(n.x,n.y,0,n.x,n.y,BASE_R);gr.addColorStop(0,'#5f6a5e');gr.addColorStop(.75,'#4b5a4d');gr.addColorStop(.95,'#33463a');gr.addColorStop(1,'rgba(40,70,52,0)');
    g.fillStyle=gr;g.beginPath();g.arc(n.x,n.y,BASE_R,0,TAU);g.fill();
    gr=g.createRadialGradient(n.x,n.y,40,n.x,n.y,BASE_R*.8);gr.addColorStop(0,'rgba('+tint+',.35)');gr.addColorStop(1,'rgba('+tint+',0)');g.fillStyle=gr;g.beginPath();g.arc(n.x,n.y,BASE_R,0,TAU);g.fill();
    g.strokeStyle='rgba('+tint+',.5)';g.lineWidth=5;g.beginPath();g.arc(n.x,n.y,BASE_R*.55,0,TAU);g.stroke();g.lineWidth=2;g.beginPath();g.arc(n.x,n.y,BASE_R*.42,0,TAU);g.stroke();
    for(let i=0;i<8;i++){const a=i*TAU/8;g.beginPath();g.moveTo(n.x+Math.cos(a)*BASE_R*.42,n.y+Math.sin(a)*BASE_R*.42);g.lineTo(n.x+Math.cos(a)*BASE_R*.55,n.y+Math.sin(a)*BASE_R*.55);g.stroke()}
    // 石砖
    for(let i=0;i<260;i++){const a=R()*TAU,r=Math.sqrt(R())*BASE_R*.92;g.fillStyle='rgba(0,0,0,.10)';g.fillRect(n.x+Math.cos(a)*r,n.y+Math.sin(a)*r,10+R()*14,6+R()*8)}
  }
  // 兵道
  strokePath(ROAD*2+36,'rgba(10,20,14,.35)');strokePath(ROAD*2+10,'#4e4838');strokePath(ROAD*2-8,'#7a7058');strokePath(ROAD*2-50,'#85795f');

    else{ctx.strokeStyle='#fff';ctx.lineWidth=2;for(let i=0;i<9;i++){const a=i*2.4+G.t,rr_=(i%3+1)*z.r/4;const px=z.x+Math.cos(a)*rr_,py=z.y+Math.sin(a)*rr_;const fy=((G.t*500+i*90)%260);ctx.beginPath();ctx.moveTo(px,py-fy);ctx.lineTo(px-3,py-fy+30);ctx.stroke()}}
    ctx.globalAlpha=1;return}
  if(z.style==='fire'){
    const life=z.age<z.delay?0:1;const fade=Math.min(1,(z.delay+z.dur-z.age)/.5);
    const g=ctx.createRadialGradient(z.x,z.y,0,z.x,z.y,z.r);g.addColorStop(0,'rgba(255,230,120,.55)');g.addColorStop(.6,'rgba(255,110,40,.4)');g.addColorStop(1,'rgba(200,40,20,.12)');

    ctx.fillStyle='#ffd070';for(let i=0;i<14;i++){const a=i*1.9+G.t*.8,d=((i*37)%100)/100*z.r*.9;const fx=z.x+Math.cos(a)*d,fy=z.y+Math.sin(a)*d*.9;const hgt=18+10*Math.sin(G.t*9+i);ctx.beginPath();ctx.moveTo(fx-6,fy);ctx.quadraticCurveTo(fx,fy-hgt*1.6,fx+6,fy);ctx.fill()}
    ctx.globalAlpha=1}
}

  const vis=u=>u.x>vx0&&u.x<vx1&&u.y>vy0&&u.y<vy1;
  for(const z of G.zones)drawZone(z);
  // 塔射程
  for(const u of G.units){if(u.kind!=='tower'||u.dead||!vis(u))continue;if(Math.hypot(u.x-p.x,u.y-p.y)<u.range+260){ctx.strokeStyle=TEAMS[u.team].col;ctx.globalAlpha=.3;ctx.lineWidth=3;ctx.setLineDash([16,14]);ctx.beginPath();ctx.arc(u.x,u.y,u.range,0,TAU);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1}}

  const rows=G.heroes.map(h=>'<tr><td class="'+(h.team===0?'b':'r')+'">'+h.name+(h===G.player?'（你）':'')+'</td><td>'+h.level+'</td><td>'+h.k+' / '+h.d+' / '+h.a+'</td><td>'+h.cs+'</td><td>'+Math.round(h.dmgDealt)+'</td><td>'+Math.floor(h.gold)+'</td></tr>').join('');
  $('resBox').innerHTML='<h2 style="color:'+(win?'#ffd95a':'#9aa8b0')+'">'+(win?'胜 利':'败 北')+'</h2><div class="sub" style="letter-spacing:.15em">'+(win?'敌方龙脉晶已被摧毁':'我方龙脉晶已被摧毁')+' · 用时 '+fmtT(G.t)+'</div>'+
    '<table><tr><th>英雄</th><th>等级</th><th>击杀/死亡/助攻</th><th>补刀</th><th>对英雄伤害</th><th>金币</th></tr>'+rows+'</table>'+
    '<div class="sub" style="letter-spacing:.1em">击杀 '+G.kills[0]+' : '+G.kills[1]+'　·　摧毁防御塔 '+G.towerKills[0]+' : '+G.towerKills[1]+'</div>'+
    '<div class="credit" style="margin:12px 0 8px">浮士德工作室 出品<small>Faustus Studio</small></div>'+
    '<div><div class="btn sm" id="rAgain">再战一局</div><div class="btn sm" id="rMenu">返回选将</div></div>';
  $('result').classList.remove('hide');sfx(win?'victory':'defeat');
  $('rAgain').onclick=()=>startGame();$('rMenu').onclick=()=>showMenu();
}
/* 商店 */
function openShop(){if(!G||G.over)return;shopOpen=true;$('shop').classList.remove('hide');renderShop()}
function closeShop(){shopOpen=false;$('shop').classList.add('hide')}
function renderShop(){
  if(!shopOpen)return;const p=G.player;const can=inBase(p)||p.dead;
  let h='<h4><span>商店　<small style="color:#ffd95a">金币 '+Math.floor(p.gold)+'</small></span><span style="cursor:pointer" id="shX">✕</span></h4>';
  h+='<div class="tip">'+(can?'点击购买；点击已拥有的装备可按 70% 价格出售。':'<span style="color:#ff9a86">只能在基地（泉水）内或阵亡时购买。</span>')+'</div><div id="own">';
  for(let i=0;i<6;i++){const id=p.items[i];h+='<div class="it" data-s="'+i+'" title="'+(id?ITEMBYID[id].n+'（点击出售）':'空')+'"><i>'+(id?ITEMBYID[id].g:'')+'</i></div>'}
  h+='</div><div class="grid">';
  h+='<div class="it'+(p.gold<POTION.cost||p.potions>=POTION.max?' no':'')+'" data-p="1"><i style="background:#5ac07a">药</i><div><b>治疗药水</b> <span class="c">'+POTION.cost+'</span><small>6 秒内回复 '+POTION.heal+' 生命（按 1 使用，最多 '+POTION.max+' 瓶）</small></div></div>';
  for(const it of ITEMS)h+='<div class="it'+(p.gold<it.cost||p.items.length>=6?' no':'')+'" data-b="'+it.id+'"><i>'+it.g+'</i><div><b>'+it.n+'</b> <span class="c">'+it.cost+'</span><small>'+it.d+'</small></div></div>';
  h+='</div>';$('shop').innerHTML=h;
  $('shX').onclick=closeShop;
  $('shop').querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>{if(!can){G.hint={t:G.t,txt:'只能在基地内购买'};sfx('warn');return}if(!buyItem(p,e.dataset.b))sfx('warn');renderShop()});
  $('shop').querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{if(!can){sfx('warn');return}sellItem(p,+e.dataset.s);renderShop()});
  $('shop').querySelector('[data-p]').onclick=()=>{if(!can){sfx('warn');return}if(!buyPotion(p))sfx('warn');renderShop()};
}
/* 指令 */
function issueOrder(wx,wy,amove,hold){
  const p=G.player;if(p.dead||G.over)return;
  if(p.dash||p.stun>0)return;
  cancelRecall(p);
  if(!amove){
    let best=null,bd=1e9;
    for(const u of G.units){if(u.team===p.team||u.dead||!targetable(u))continue;const d=Math.hypot(u.x-wx,u.y-wy);if(d<=u.r+14&&d<bd){bd=d;best=u}}
    if(best){p.order={type:'attack',target:best};if(!hold)G.marks.push({x:best.x,y:best.y,t:0,col:'#ff5a40'});return}
  }
  const w=walkPoint(wx,wy);
  p.order={type:amove?'amove':'move',x:w.x,y:w.y};
  if(!hold)G.marks.push({x:w.x,y:w.y,t:0,col:amove?'#ff7a50':'#a8ffb8'});
}
function miniToWorld(mx,my){const m=UIH.mini;return {x:(mx-m.x)/m.w*W,y:(my-m.y)/m.h*H}}
function inRect(r,x,y){return r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}
let miniDrag=false;
function castKey(i){
  if(!G||G.paused||G.over)return;const p=G.player;
  if(p.dead)return;
  if(!tryCast(p,i,MOUSE.wx,MOUSE.wy)&&p.ranks[i]>0&&p.cds[i]>0)G.hint={t:G.t,txt:'技能冷却中'};
}
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousedown',e=>{
  if(mode!=='play'||!G||G.paused)return;auInit();
  const mx=e.clientX,my=e.clientY;MOUSE.x=mx;MOUSE.y=my;
  if(e.button===0){
    for(const b of UIH.plus){if(inRect(b,mx,my)){learn(G.player,b.i);return}}
    if(inRect(UIH.potion,mx,my)){usePotion(G.player);return}
    if(inRect(UIH.mini,mx,my)){miniDrag=true;const w=miniToWorld(mx,my);G.cam.ox=w.x-G.player.x;G.cam.oy=w.y-G.player.y;return}
    const wp=s2w(mx,my);
    if(G.amode){G.amode=false;issueOrder(wp.x,wp.y,true);return}
    issueOrder(wp.x,wp.y,false);
  }else if(e.button===2){
    G.amode=false;
    if(inRect(UIH.mini,mx,my)){const w=miniToWorld(mx,my);issueOrder(w.x,w.y,false);return}
    const wp=s2w(mx,my);issueOrder(wp.x,wp.y,false);MOUSE.rmb=true;
  }
});
window.addEventListener('mouseup',e=>{if(e.button===2)MOUSE.rmb=false;if(e.button===0)miniDrag=false});
window.addEventListener('mousemove',e=>{MOUSE.x=e.clientX;MOUSE.y=e.clientY;MOUSE.inside=true;
  if(miniDrag&&G&&inRect(UIH.mini,e.clientX,e.clientY)){const w=miniToWorld(e.clientX,e.clientY);G.cam.ox=w.x-G.player.x;G.cam.oy=w.y-G.player.y}});
document.addEventListener('mouseleave',()=>{MOUSE.inside=false});
window.addEventListener('keydown',e=>{
  const c=e.code;
  if(['Space','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c))e.preventDefault();
  if(mode==='menu'){if(c==='Enter')startGame();return}
  if(!G)return;
  if(c==='KeyM'){AU.mute=!AU.mute;if(AU.mute&&AU.ctx){}return}
  if(c==='Escape'){if(shopOpen){closeShop();return}if(G.amode){G.amode=false;return}togglePause();return}
  if(c==='KeyF'&&!e.repeat){G.speed=G.speed===1?1.5:G.speed===1.5?2:1;G.hint={t:G.t,txt:'游戏速度 ×'+G.speed};sfx('click');return}
  if(G.paused||e.repeat&&!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c)){KEYS[c]=true;return}
  KEYS[c]=true;
  const p=G.player;
  const qi={KeyQ:0,KeyW:1,KeyE:2,KeyR:3}[c];
  if(qi!==undefined){e.preventDefault();if(e.ctrlKey||e.shiftKey||e.altKey){if(!learn(p,qi))sfx('warn')}else castKey(qi);return}
  if(c==='KeyB'){if(startRecall(p)){}return}
  if(c==='KeyP'){shopOpen?closeShop():openShop();sfx('click');return}
  if(c==='Digit1'){usePotion(p);return}
  if(c==='KeyA'){if(!p.dead)G.amode=true;return}
  if(c==='KeyS'){p.order=null;p.windup=null;return}
  if(c==='Space'){G.cam.ox=0;G.cam.oy=0;return}
});
window.addEventListener('keyup',e=>{KEYS[e.code]=false});
window.addEventListener('blur',()=>{for(const k in KEYS)KEYS[k]=false;MOUSE.rmb=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&G&&!G.over&&!G.paused)togglePause()});
$('btnStart').onclick=startGame;
$('bResume').onclick=togglePause;
$('bRestart').onclick=()=>{startGame()};
$('bMenu').onclick=()=>showMenu();
window.addEventListener('resize',resize);
/* 主循环 */
let lastT=performance.now(),acc=0,uiT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  if(G&&mode==='play'){
    if(!G.paused){
      acc+=dt*G.speed;let n=0;while(acc>=1/60&&n<8){stepGame(1/60);acc-=1/60;n++}if(n>=8)acc=0;
      const p=G.player;
      if(MOUSE.rmb&&!p.dead&&p.order&&p.order.type==='move'){const wp=s2w(MOUSE.x,MOUSE.y);const w=walkPoint(wp.x,wp.y);p.order.x=w.x;p.order.y=w.y}
      // 镜头：空格回正、方向键 / 边缘滚屏
      const cm=G.cam;
      if(KEYS.Space){cm.ox*=.7;cm.oy*=.7}
      let px=0,py=0;if(KEYS.ArrowLeft)px-=1;if(KEYS.ArrowRight)px+=1;if(KEYS.ArrowUp)py-=1;if(KEYS.ArrowDown)py+=1;
      if(MOUSE.inside&&!shopOpen&&!miniDrag){if(MOUSE.x<=4)px-=1;if(MOUSE.x>=VW-5)px+=1;if(MOUSE.y<=4)py-=1;if(MOUSE.y>=VH-5)py+=1}
      cm.ox=clamp(cm.ox+px*1000*dt,-1400,1400);cm.oy=clamp(cm.oy+py*1000*dt,-1000,1000);
      musicTick(dt);
      uiT-=dt;if(uiT<=0){uiT=.25;renderShop()}
      if(G.over&&G.endT>3&&!G.resShown)showResult();
    }
  }
  render(dt);
}
/* 初始化 */
resize();buildBG();buildMenu();
(function(){ // 菜单背景用一局空局面
  newGame({hero:0,diff:1,speed:1,auto:true});G.paused=true;
})();
requestAnimationFrame(frame);
// 测试钩子
window.__dbg={get G(){return G},step(n,dt){for(let i=0;i<n;i++){stepGame(dt||1/60);if(G.over&&G.endT>3.5)break}},start:startGame,SET,showResult,
  render:()=>render(.016)};
</script>
